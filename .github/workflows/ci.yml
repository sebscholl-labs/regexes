name: CI

on:
  push:
    branches:
      - main
  pull_request:

defaults:
  run:
    working-directory: gem

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby-version:
          - "4.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          working-directory: gem
          bundler-cache: true
        env:
          BUNDLE_WITHOUT: development:quality

      # test/properties/ecmascript_test.rb runs every translated pattern in Node.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Minitest
        run: bundle exec rake test
        env:
          BUNDLE_WITHOUT: development:quality

  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          working-directory: gem
          bundler-cache: true
        env:
          BUNDLE_WITHOUT: development

      - name: Lint
        run: bundle exec rake lint
        env:
          BUNDLE_WITHOUT: development

  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
