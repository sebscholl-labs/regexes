plugins:
  - rubocop-minitest
  - rubocop-yard

# Project cops (rubocop/cop/regexes/). See .claude/rules/.
require:
  - ./rubocop/cop/regexes/one_assertion_per_test
  - ./rubocop/cop/regexes/one_test_class_per_file
  - ./rubocop/cop/regexes/mirrored_test_path
  - ./rubocop/cop/regexes/pattern_naming

AllCops:
  TargetRubyVersion: 4.0
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - 'vendor/**/*'
    - 'bin/**/*'

Layout/LineLength:
  Max: 120
  Exclude:
    - 'test/**/*_test.rb'

Metrics/BlockLength:
  Exclude:
    - 'test/**/*_test.rb'

Metrics/ClassLength:
  Enabled: false

Metrics/ModuleLength:
  Enabled: false

# Hash value omission (foo: foo → foo:) wherever possible.
Style/HashSyntax:
  EnforcedShorthandSyntax: always

# Hash values aligned in a column for multi-line hash literals.
Layout/HashAlignment:
  EnforcedColonStyle: table
  EnforcedHashRocketStyle: table

# Consecutive `=` assignments aligned in a column.
Layout/ExtraSpacing:
  ForceEqualSignAlignment: true

Style/ModuleFunction:
  EnforcedStyle: extend_self

Style/ClassMethodsDefinitions:
  Enabled: true
  EnforcedStyle: self_class

Style/DocumentationMethod:
  Enabled: true
  RequireForNonPublicMethods: true

YARD/CollectionStyle:
  EnforcedStyle: long

# Regexes/OneAssertionPerTest replaces it: it also sees the suite's `test '…' do` blocks and define_method.
Minitest/MultipleAssertions:
  Enabled: false

# ── Project cops (rubocop/cop/regexes/). See .claude/rules/tests.md and .claude/rules/patterns.md. ──────────

Regexes/OneAssertionPerTest:
  Enabled: true
  Include:
    - 'test/**/*_test.rb'

Regexes/OneTestClassPerFile:
  Enabled: true
  Include:
    - 'test/**/*_test.rb'

Regexes/MirroredTestPath:
  Enabled: true
  Include:
    - 'test/**/*_test.rb'
  # These directories don't mirror lib/ (see .claude/rules/tests.md).
  Exclude:
    - 'test/support/**/*'
    - 'test/properties/**/*'

Regexes/PatternNaming:
  Enabled: true
  Include:
    - 'lib/**/*.rb'
